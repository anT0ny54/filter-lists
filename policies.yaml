# Filter-Lists v7.4 compatibility policy.
version: 3
profile: strict-abp
compatibility:
  - Adblock Plus
  - uBlock Origin
  - AdGuard
rules:
  allow_network_filters: true
  allow_abp_cosmetic: true
  allow_extended_css: true
  reject_ubo_procedural: true
  reject_ubo_extended_exceptions: true
  reject_hosts_format: true
  reject_html_error_pages: true
  reject_unknown_options: true
  reject_duplicate_options: true
  require_domain_for_rewrite: true
limits:
  max_rule_length: 100000
  max_include_depth: 5
  max_download_bytes: 52428800
  max_total_download_bytes: 524288000
  max_total_sources: 500
  total_timeout_seconds: 1800
source_health:
  minimum_success_ratio: 0.80
  fail_if_zero_sources: true

anomaly_detection:
  enabled: true
  max_bytes_change_ratio: 0.75
  max_rule_count_change_ratio: 0.75
  max_rejection_rate_change: 0.25
  min_lines: 100
  # If true, warning-level anomalies fail the build; default keeps them advisory.
  fail_on_warning: false
