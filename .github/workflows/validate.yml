name: Validate Filter List V6.6

on:
  pull_request:
    paths:
      - "sources.yaml"
      - "sources.txt"
      - "custom-rules.txt"
      - "policies.yaml"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: |
          set -Eeuo pipefail
          python -m py_compile scripts/*.py
          python -m unittest discover -s tests -p 'test_*.py' -v
