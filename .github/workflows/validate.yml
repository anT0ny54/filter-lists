name: Validate Filter List

on:
  pull_request:
    paths:
      - "sources.yaml"
      - "custom-rules.txt"
      - "policies.yaml"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: |
          set -Eeuo pipefail
          python -m py_compile scripts/*.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run benchmark
        run: python3 scripts/benchmark.py --repeats 3
      - name: Optional differential engine test
        run: python3 scripts/differential.py
