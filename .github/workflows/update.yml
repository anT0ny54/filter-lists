name: Update Filter List

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources.txt"
      - "custom-rules.txt"
      - "scripts/**"
      - ".github/workflows/update.yml"

concurrency:
  group: update-filter-list
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Merge and publish filters
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate builder
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x scripts/merge.sh || chmod +x scripts/merge.sh
          python3 -m py_compile scripts/merge.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate filter list
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/merge.sh
          test -s filters.txt
          grep -q '^! Total rules: [1-9][0-9]*$' filters.txt

      - name: Commit and push changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- filters.txt
          if git diff --cached --quiet -- filters.txt; then
            echo "No changes to filters.txt"
            exit 0
          fi
          rules="$(sed -n 's/^! Total rules: //p' filters.txt)"
          git commit -m "chore(filters): auto-update filter list (${rules} rules) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
