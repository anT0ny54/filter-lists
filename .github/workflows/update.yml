name: Update Filter List

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources.yaml"
      - "custom-rules.txt"
      - "policies.yaml"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

# Shared with Keep-Alive.yml: both push to the default branch, and their crons
# used to fire in the same minute, racing on `git push`.
concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Build and publish filters
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate builder and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.py scripts/merge.sh
          python -m py_compile scripts/*.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate filter list
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/merge.sh
          test -s filters.txt
          test -s reports/latest.json
          grep -q '^! Total rules: [1-9][0-9]*$' filters.txt

      - name: Strict V7 validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate.py filters.txt
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          # Derive expectations from the code so a version/schema bump cannot
          # silently desynchronize this gate from the builder.
          from config import BUILDER_VERSION
          from report import SCHEMA_VERSION
          data = json.loads(Path("reports/latest.json").read_text())
          assert data["schema"] == SCHEMA_VERSION
          assert data["builder"] == f"Filter-Lists v{BUILDER_VERSION}"
          assert data["rules"]["unique_rules"] > 0
          assert data["sources"]["success_ratio"] >= data["sources"]["health_threshold"]
          assert not data["sources"]["required_failed"]
          assert not data["sources"]["timed_out"]
          assert not data["sources"]["source_limit_reached"]
          assert data["anomalies"]["critical_count"] == 0
          assert data["anomalies"].get("enforced_failure") is False
          assert len(data["provenance"]["source_manifest_sha256"]) == 64
          assert data["sources"]["total_download_bytes"] <= data["sources"]["max_total_download_bytes"]
          print(json.dumps({
              "build_id": data["build_id"],
              "rules": data["rules"]["unique_rules"],
              "sources": f'{data["sources"]["root_successful"]}/{data["sources"]["root_requested"]}',
              "anomalies": data["anomalies"]["count"],
              "build_seconds": data["build_seconds"],
          }, indent=2))
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- filters.txt reports/latest.json reports/history sources.txt
          if git diff --cached --quiet -- filters.txt reports/latest.json reports/history sources.txt; then
            echo "No generated changes"
            exit 0
          fi
          rules="$(sed -n 's/^! Total rules: //p' filters.txt)"
          version="$(sed -n 's/^! Version: //p' filters.txt | cut -d- -f1)"
          git commit -m "chore(filters): auto-update ${version} filter list (${rules} rules) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
