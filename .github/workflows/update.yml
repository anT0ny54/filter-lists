name: Update Filter List

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources.yaml"
      - "sources.txt"
      - "custom-rules.txt"
      - "policies.yaml"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

concurrency:
  group: update-filter-list
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Build and publish filters
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate builder and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.py scripts/merge.sh
          python -m py_compile scripts/*.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate filter list
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/merge.sh
          test -s filters.txt
          test -s reports/latest.json
          grep -q '^! Total rules: [1-9][0-9]*$' filters.txt

      - name: Strict V6 validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate.py filters.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("reports/latest.json").read_text())
          assert data["rules"]["unique_rules"] > 0
          assert data["sources"]["successful"] >= max(1, int(data["sources"]["requested"] * 0.5))
          print(json.dumps(data, indent=2))
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- filters.txt reports/latest.json
          if git diff --cached --quiet -- filters.txt reports/latest.json; then
            echo "No generated changes"
            exit 0
          fi
          rules="$(sed -n 's/^! Total rules: //p' filters.txt)"
          git commit -m "chore(filters): auto-update filter list (${rules} rules) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
