name: Update Filter List V7.1.1

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources.yaml"
      - "custom-rules.txt"
      - "policies.yaml"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

concurrency:
  group: update-filter-list
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Build and publish filters
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate builder and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.py scripts/merge.sh
          python -m py_compile scripts/*.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate filter list
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/merge.sh
          test -s filters.txt
          test -s reports/latest.json
          grep -q '^! Total rules: [1-9][0-9]*$' filters.txt

      - name: Strict V7 validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate.py filters.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("reports/latest.json").read_text())
          assert data["schema"] == 3
          assert data["builder"] == "Filter-Lists v7.1.1"
          assert data["rules"]["unique_rules"] > 0
          assert data["sources"]["success_ratio"] >= data["sources"]["health_threshold"]
          assert not data["sources"]["required_failed"]
          assert not data["sources"]["timed_out"]
          assert not data["sources"]["source_limit_reached"]
          assert data["sources"]["total_download_bytes"] <= data["sources"]["max_total_download_bytes"]
          print(json.dumps(data, indent=2))
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- filters.txt reports/latest.json sources.txt
          if git diff --cached --quiet -- filters.txt reports/latest.json sources.txt; then
            echo "No generated changes"
            exit 0
          fi
          rules="$(sed -n 's/^! Total rules: //p' filters.txt)"
          git commit -m "chore(filters): auto-update V7.1.1 filter list (${rules} rules) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
